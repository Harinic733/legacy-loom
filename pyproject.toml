[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "legacy-loom"
version = "0.1.0"
description = "Autonomous agent swarm for verified legacy code migration"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = {file = "LICENSE"}

dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "hypothesis>=6.100",
    "pytest>=8.0",
    "pydantic>=2.0"
]

[project.optional-dependencies]
dev = [
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10"
]

[project.scripts]
loom = "loom.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.packages.find]
include = ["loom*"]